services:
  - type: web
    name: syncsphere-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://frontend-mohd-sarim.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-mohd-sarim.vercel.app,https://frontend-two-nu-86.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://frontend-mohd-sarim.vercel.app,https://frontend-two-nu-86.vercel.app
      - key: DB_ENGINE
        value: django.db.backends.sqlite3
      - key: DB_NAME
        value: /tmp/syncsphere.sqlite3
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: EMAIL_PORT
        value: "587"
