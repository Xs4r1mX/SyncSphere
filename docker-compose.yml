services:
  redis:
    image: redis:7-alpine
    container_name: syncsphere-redis
    ports:
      # Default 6379. Set REDIS_HOST_PORT if a local Redis service already owns 6379.
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
